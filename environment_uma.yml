name: cmcc-rxn-uma
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - jupyterlab
  - pip:
      - mccoygroup-psience
      - rdkit
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cu128.html
      - fairchem-core
      - git+https://github.com/Center-for-Mechanical-Control-of-Chem/cmcc-reactions.git
